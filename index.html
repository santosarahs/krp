<title>KRP Bread Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --paper:#FAF8F2; --surface:#FFFFFF; --surface-2:#F1EEE4; --inset:#F6F3EA;
    --ink:#241F18; --ink-2:#6D665A; --ink-3:#948C7C;
    --line:#E4DECF; --line-2:#EEE9DC;
    --accent:#6C48A6; --accent-ink:#FFFFFF; --accent-soft:#EEE8F7;
    --good:#2E7D51; --good-soft:#E4F1E9;
    --warn:#A9761F; --warn-soft:#F6ECD8;
    --bad:#B23B39; --bad-soft:#F7E4E3;
    --p-malunggay:#4E7C43; --p-ube:#7E5BB0; --p-spanish:#BE8329; --p-other:#5A7A8C;
    --shadow:0 1px 2px rgba(40,32,16,.04), 0 6px 20px -12px rgba(40,32,16,.18);
    --radius:14px; --radius-sm:9px;
    --maxw:1360px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#16130E; --surface:#1F1B15; --surface-2:#2A251D; --inset:#241F18;
      --ink:#F1EBDE; --ink-2:#A79E8C; --ink-3:#7C7362;
      --line:#352E23; --line-2:#2C261D;
      --accent:#B79BE4; --accent-ink:#1B1524; --accent-soft:#2C2440;
      --good:#74C295; --good-soft:#1E2F26;
      --warn:#DBAF66; --warn-soft:#332A19;
      --bad:#E58F8D; --bad-soft:#33211F;
      --p-malunggay:#8CBE7F; --p-ube:#BB9CE6; --p-spanish:#DDAF6A; --p-other:#8FB0C0;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 26px -14px rgba(0,0,0,.6);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"] {
    --paper:#16130E; --surface:#1F1B15; --surface-2:#2A251D; --inset:#241F18;
    --ink:#F1EBDE; --ink-2:#A79E8C; --ink-3:#7C7362;
    --line:#352E23; --line-2:#2C261D;
    --accent:#B79BE4; --accent-ink:#1B1524; --accent-soft:#2C2440;
    --good:#74C295; --good-soft:#1E2F26;
    --warn:#DBAF66; --warn-soft:#332A19;
    --bad:#E58F8D; --bad-soft:#33211F;
    --p-malunggay:#8CBE7F; --p-ube:#BB9CE6; --p-spanish:#DDAF6A; --p-other:#8FB0C0;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 26px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }

  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
  }
  h1,h2,h3 { font-family:"Fraunces", Georgia, "Times New Roman", serif; font-weight:600; margin:0; line-height:1.15; text-wrap:balance; }
  button, input, select, textarea { font:inherit; color:inherit; }
  a { color:var(--accent); }
  .mono { font-family:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric:tabular-nums; }
  .num { font-family:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-variant-numeric:tabular-nums; }

  /* ---------- shell ---------- */
  .app { display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100vh; max-width:var(--maxw); margin:0 auto; }
  .side {
    border-right:1px solid var(--line); padding:22px 16px 24px; position:sticky; top:0; align-self:start;
    height:100vh; display:flex; flex-direction:column; gap:6px;
  }
  .brand { display:flex; align-items:center; gap:10px; padding:4px 8px 16px; }
  .brand .mark {
    width:34px; height:34px; border-radius:9px; background:var(--accent); color:var(--accent-ink);
    display:grid; place-items:center; font-family:"Fraunces",serif; font-weight:600; font-size:18px; flex:none;
  }
  .brand b { font-family:"Fraunces",serif; font-weight:600; font-size:17px; letter-spacing:.2px; }
  .brand span { display:block; font-size:11px; color:var(--ink-3); letter-spacing:.14em; text-transform:uppercase; margin-top:1px; }
  .nav { display:flex; flex-direction:column; gap:2px; }
  .nav button {
    display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:none; border:0;
    padding:9px 10px; border-radius:9px; color:var(--ink-2); cursor:pointer; font-weight:500;
  }
  .nav button svg { width:18px; height:18px; flex:none; }
  .nav button:hover { background:var(--surface-2); color:var(--ink); }
  .nav button.on { background:var(--accent-soft); color:var(--accent); }
  :root[data-theme="dark"] .nav button.on, :root:not([data-theme="light"]) .nav button.on { color:var(--ink); }
  .side .foot { margin-top:auto; font-size:11.5px; color:var(--ink-3); padding:0 10px; }
  .side .foot button { background:none; border:0; color:var(--ink-3); cursor:pointer; padding:4px 0; text-decoration:underline; text-underline-offset:2px; }

  .main { padding:26px 30px 90px; min-width:0; }
  .head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
  .head h1 { font-size:26px; }
  .head .sub { color:var(--ink-2); font-size:13px; margin-top:3px; }

  /* ---------- primitives ---------- */
  .btn {
    display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); padding:8px 13px; border-radius:9px; cursor:pointer; font-weight:500; box-shadow:var(--shadow);
  }
  .btn:hover { border-color:var(--ink-3); }
  .btn.primary { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  .btn.primary:hover { filter:brightness(1.06); }
  .btn.ghost { box-shadow:none; background:none; }
  .btn.sm { padding:5px 9px; font-size:13px; border-radius:8px; }
  .btn.danger { color:var(--bad); border-color:var(--bad-soft); }
  .btn svg { width:16px; height:16px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
  .card.pad { padding:18px; }
  .card h2 { font-size:16px; }
  .card h3 { font-size:14px; }

  input[type=text], input[type=number], input[type=date], select, textarea {
    background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 10px; width:100%;
  }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, .nav button:focus-visible {
    outline:2px solid var(--accent); outline-offset:2px;
  }
  input[type=number] { text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }
  label.fld { display:block; }
  label.fld > span { display:block; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); margin-bottom:4px; }

  .pill {
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:500; padding:3px 8px; border-radius:999px;
    background:var(--surface-2); color:var(--ink-2); letter-spacing:.02em;
  }
  .pill.dot::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
  .pill.good { background:var(--good-soft); color:var(--good); }
  .pill.warn { background:var(--warn-soft); color:var(--warn); }
  .pill.bad  { background:var(--bad-soft); color:var(--bad); }
  .pill.ex { background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 6px,transparent 6px,transparent 12px); color:var(--ink-3); border:1px dashed var(--line); }

  .muted { color:var(--ink-2); }
  .tiny { font-size:12px; }
  .right { text-align:right; }
  .row { display:flex; gap:10px; align-items:center; }
  .wrap { flex-wrap:wrap; }
  .grow { flex:1; min-width:0; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  /* ---------- stat tiles ---------- */
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(158px,1fr)); gap:12px; }
  .tile { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:13px 14px; }
  .tile .k { font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); }
  .tile .v { font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:21px; margin-top:3px; letter-spacing:-.01em; }
  .tile .m { font-size:12px; color:var(--ink-2); margin-top:2px; }
  .tile.hi { background:var(--accent-soft); border-color:transparent; }
  .tile.hi .v { color:var(--accent); }
  :root[data-theme="dark"] .tile.hi .v, :root:not([data-theme="light"]) .tile.hi .v { color:var(--ink); }

  /* ---------- tables ---------- */
  .tblwrap { overflow-x:auto; }
  table.t { width:100%; border-collapse:collapse; font-size:13px; }
  table.t th, table.t td { padding:7px 10px; text-align:left; border-bottom:1px solid var(--line-2); white-space:nowrap; }
  table.t td .stack { display:flex; flex-direction:column; gap:0; line-height:1.3; align-items:flex-end; }
  table.t td .stack b { font-weight:600; }
  table.t td .stack small { font-size:11px; color:var(--ink-3); font-weight:400; }
  table.t th { font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); font-weight:600; }
  table.t td.n, table.t th.n { text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }
  table.t tr:last-child td { border-bottom:0; }
  table.t tbody tr:hover td { background:var(--inset); }
  table.t tr.tot td { border-top:2px solid var(--line); font-weight:600; background:var(--inset); }

  .plList { display:flex; flex-direction:column; }
  .plRow { display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:10px 0; border-bottom:1px solid var(--line-2); }
  .plRow:last-child { border-bottom:0; }
  .plRow .lbl { color:var(--ink-2); }
  .plRow .val { font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:15px; }
  .plRow.big .lbl { color:var(--ink); font-weight:600; }
  .plRow.big .val { font-size:19px; }
  .plRow.sub .lbl { padding-left:14px; font-size:12.5px; color:var(--ink-3); }
  .plRow.sub .val { font-size:13px; color:var(--ink-2); }

  /* ---------- trip cards ---------- */
  .trip { border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .trip > summary { list-style:none; cursor:pointer; padding:13px 15px; display:flex; align-items:center; gap:12px; }
  .trip > summary::-webkit-details-marker { display:none; }
  .trip[open] > summary { border-bottom:1px solid var(--line-2); background:var(--inset); }
  .trip .cartTag { font-weight:600; font-family:"Fraunces",serif; }
  .trip .body { padding:14px 15px 16px; display:grid; gap:14px; }

  .prod { display:grid; grid-template-columns:minmax(120px,1.1fr) repeat(4, minmax(64px,1fr)); gap:10px 12px; align-items:end; }
  .prod .ph { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); }
  .prod .pname { display:flex; align-items:center; gap:8px; font-weight:500; }
  .prod .pname::before { content:""; width:9px; height:9px; border-radius:3px; background:var(--pc,var(--p-other)); flex:none; }
  .prod .cell { display:flex; align-items:baseline; gap:5px; justify-content:flex-end; }
  .prod .cell .u { font-size:11px; color:var(--ink-3); }
  .prod .val { font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }
  .prod .pair { display:flex; gap:5px; }
  .prod .pair input { width:100%; padding:7px 8px; }

  .exp { display:flex; flex-direction:column; gap:8px; }
  .exp .er { display:grid; grid-template-columns:1fr 130px auto; gap:8px; }

  /* dialog */
  dialog { border:1px solid var(--line); border-radius:16px; padding:0; background:var(--surface); color:var(--ink); box-shadow:0 20px 60px -20px rgba(0,0,0,.4); max-width:560px; width:calc(100vw - 32px); }
  dialog::backdrop { background:rgba(20,16,10,.42); backdrop-filter:blur(2px); }
  .dlg-h { padding:16px 18px; border-bottom:1px solid var(--line-2); display:flex; align-items:center; justify-content:space-between; }
  .dlg-b { padding:18px; display:grid; gap:14px; max-height:70vh; overflow:auto; }
  .dlg-f { padding:14px 18px; border-top:1px solid var(--line-2); display:flex; justify-content:flex-end; gap:9px; }
  .g2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .segbar { display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--surface); }
  .segbar button { border:0; background:none; padding:7px 12px; cursor:pointer; color:var(--ink-2); font-weight:500; }
  .segbar button.on { background:var(--accent-soft); color:var(--accent); }
  :root[data-theme="dark"] .segbar button.on, :root:not([data-theme="light"]) .segbar button.on { color:var(--ink); }

  .chart { width:100%; height:auto; display:block; }
  .chart text { font-family:"IBM Plex Mono",monospace; fill:var(--ink-3); }
  .chart .bar { fill:var(--accent); }
  .chart .bar:hover { fill:var(--ink); }
  .chart .grid { stroke:var(--line-2); }
  .chart .axis { stroke:var(--line); }

  .empty { text-align:center; padding:34px 20px; color:var(--ink-2); }
  .empty h3 { color:var(--ink); margin-bottom:6px; }

  .toast {
    position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:50;
    background:var(--ink); color:var(--paper); padding:9px 15px; border-radius:999px; font-size:13px; box-shadow:var(--shadow);
  }

  /* ---------- mobile ---------- */
  @media (max-width:860px) {
    .app { grid-template-columns:1fr; }
    .side {
      position:fixed; bottom:0; left:0; right:0; top:auto; height:auto; width:100%;
      flex-direction:row; align-items:center; gap:2px; border-right:0; border-top:1px solid var(--line);
      background:var(--surface); padding:6px 6px calc(6px + env(safe-area-inset-bottom)); z-index:30;
    }
    .brand, .side .foot { display:none; }
    .nav { flex-direction:row; width:100%; justify-content:space-around; gap:0; }
    .nav button { flex-direction:column; gap:3px; font-size:10.5px; padding:6px 4px; border-radius:8px; }
    .nav button svg { width:20px; height:20px; }
    .main { padding:18px 16px 96px; }
    .head h1 { font-size:22px; }
    .prod { grid-template-columns:1fr 1fr; }
    .prod .pname { grid-column:1 / -1; }
    .g2 { grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="mark">K</div>
      <div><b>KRP</b><span>Bread Ledger</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div id="storeState">Loading…</div>
      <button id="themeBtn" type="button">Toggle theme</button>
    </div>
  </aside>
  <main class="main" id="view"><div class="empty"><h3>Loading your ledger…</h3></div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";

  /* ============================ constants ============================ */
  var DEFAULT_SETTINGS = {
    commissionRate: 0.15,
    products: [
      { key: "malunggay", name: "Malunggay Pandesal", price: 5, perTray: 24 },
      { key: "ube",       name: "Ube Pandesal",       price: 6, perTray: 20 },

    ],

    supplyCategories: ["Food", "Packaging", "Misc"]
  };

  var ITEM_HINTS = ["Harina King", "Asukal Bais 50kls", "Lard", "Margarine Drum", "Angel Yeast 500g",
    "Cheese Jersey 2kg", "Supot #5", "Supot 3", "Plastic Mini", "Plastic Tiny", "Vanilla",
    "Palm Oil", "Delivery Fee", "Lalamove fee"];
  var UOM_HINTS = ["sack", "kilogram", "bundle", "each", "drum", "gallon", "container", "box"];
  var PCLASS = { malunggay: "var(--p-malunggay)", ube: "var(--p-ube)", spanish: "var(--p-spanish)" };

  var NAV = [
    { id: "dashboard", label: "Overview", icon: "M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10" },
    { id: "routes",    label: "Routes",   icon: "M3 7h11v9H3zM14 10h4l3 3v3h-7zM7.5 19a1.7 1.7 0 100-3.4 1.7 1.7 0 000 3.4zM17.5 19a1.7 1.7 0 100-3.4 1.7 1.7 0 000 3.4z" },
    { id: "supplies",  label: "Supplies", icon: "M3 8l9-4 9 4-9 4-9-4zM3 8v8l9 4 9-4V8M12 12v8" },
    { id: "reports",   label: "Reports",  icon: "M4 20V4M4 20h16M8 16V9M13 16V6M18 16v-4" },
    { id: "settings",  label: "Settings", icon: "M12 15a3 3 0 100-6 3 3 0 000 6zM19 12a7 7 0 00-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 00-2-1.2l-.4-2.6H10.9l-.4 2.6a7 7 0 00-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 005 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 002 1.2l.4 2.6h2.2l.4-2.6a7 7 0 002-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z" },
    { id: "users",     label: "Users",    icon: "M16 19v-1a4 4 0 00-4-4H6a4 4 0 00-4 4v1M9 10a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM17 11l2 2 4-4" }
  ];
  function navItems() {
    return NAV.filter(function (n) {
      if (n.id === "settings") return isAdmin();
      if (n.id === "users") return multiUser() && isAdmin();
      return true;
    });
  }

  /* ============================ helpers ============================ */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function h(html) { var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }
  function num(v) { var n = parseFloat(v); return isFinite(n) ? n : 0; }
  var pf = new Intl.NumberFormat("en-PH", { maximumFractionDigits: 2 });
  var pf0 = new Intl.NumberFormat("en-PH", { maximumFractionDigits: 0 });
  function peso(n) { n = num(n); return (n < 0 ? "-₱" : "₱") + pf.format(Math.abs(n)); }
  function peso0(n) { n = num(n); return (n < 0 ? "-₱" : "₱") + pf0.format(Math.abs(Math.round(n))); }
  function intc(n) { return pf0.format(Math.round(num(n))); }
  function pct(n) { return (num(n) * 100).toFixed(1) + "%"; }
  function todayISO() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function monthOf(iso) { return iso.slice(0, 7); }
  function monthStart(m) { return m + "-01"; }
  function monthEnd(m) { var y = +m.slice(0, 4), mo = +m.slice(5, 7); return m + "-" + String(new Date(y, mo, 0).getDate()).padStart(2, "0"); }
  function addMonths(m, delta) { var y = +m.slice(0, 4), mo = +m.slice(5, 7) - 1 + delta; y += Math.floor(mo / 12); mo = ((mo % 12) + 12) % 12; return y + "-" + String(mo + 1).padStart(2, "0"); }
  function fmtDate(iso, opt) { try { return new Date(iso + "T00:00:00").toLocaleDateString("en-PH", opt || { weekday: "short", month: "short", day: "numeric" }); } catch (e) { return iso; } }
  function fmtMonth(m) { try { return new Date(m + "-01T00:00:00").toLocaleDateString("en-PH", { month: "long", year: "numeric" }); } catch (e) { return m; } }
  function uid() { return (crypto && crypto.randomUUID) ? crypto.randomUUID() : "id" + Date.now() + Math.random().toString(36).slice(2); }
  function debounce(fn, ms) { var t; return function () { var a = arguments, c = this; clearTimeout(t); t = setTimeout(function () { fn.apply(c, a); }, ms); }; }
  function pcolor(key) { return PCLASS[key] || "var(--p-other)"; }

  function toast(msg) {
    var old = $(".toast"); if (old) old.remove();
    var t = h('<div class="toast">' + esc(msg) + "</div>");
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2200);
  }

  /* ============================ storage ============================ */
  // Unified async store: Claude db capability inside the artifact,
  // Supabase on the hosted (Vercel) copy, localStorage as last resort.
  var store = null;

  // Supabase project — shared with santosfamilyhealth (separate table, own row-level security).

    function set(path, obj) { try { localStorage.setItem(P + path, JSON.stringify(obj)); } catch (e) {} return Promise.resolve(); }

      queryDays: function (start, end) {

  function dbStore(db) {

  function supabaseStore(client, userId) {

      getDoc: function (path) {
        return unwrap(client.from("krp_docs").select("data").eq("path", path).maybeSingle())
          .then(function (row) { return row ? row.data : null; }).catch(function () { return null; });
      },
      setDoc: function (path, obj) {

  /* ---------- computation ---------- */
  function computeLine(line, product) {
    var loaded = num(line.loaded), leftover = num(line.leftover);
    var sold = loaded - leftover;
    var price = line.price != null ? num(line.price) : num(product.price);
    return { loaded: loaded, leftover: leftover, sold: sold, price: price, revenue: sold * price, negative: sold < 0 };
  }
  function computeTrip(trip, settings) {
    var lines = {}, gross = 0, pieces = 0, byProd = {};
    settings.products.forEach(function (p) {
      var raw = (trip.lines && trip.lines[p.key]) || {};
      var c = computeLine(raw, p);
      lines[p.key] = c; gross += c.revenue; pieces += Math.max(0, c.sold);
      byProd[p.key] = { sold: c.sold, revenue: c.revenue };
    });
    var rate = trip.commissionRate != null ? num(trip.commissionRate) : num(settings.commissionRate);
    var commission = gross * rate;
    var net = gross - commission;
    var expenses = (trip.expenses || []).reduce(function (s, e) { return s + num(e.amount); }, 0);
    var profit = net - expenses;
    return { lines: lines, byProd: byProd, gross: gross, rate: rate, commission: commission, net: net,
      expenses: expenses, profit: profit, pieces: pieces, hasNeg: settings.products.some(function (p) { return lines[p.key].negative; }) };
  }
  function computeDay(day, settings) {
    var trips = (day && day.trips) || [];
    var acc = { gross: 0, commission: 0, net: 0, expenses: 0, profit: 0, pieces: 0, trips: trips.length, byCart: {}, byProd: {} };
    settings.products.forEach(function (p) { acc.byProd[p.key] = { sold: 0, revenue: 0 }; });
    trips.forEach(function (t) {
      var c = computeTrip(t, settings);
      acc.gross += c.gross; acc.commission += c.commission; acc.net += c.net;
      acc.expenses += c.expenses; acc.profit += c.profit; acc.pieces += c.pieces;
      acc.byCart[t.cart] = (acc.byCart[t.cart] || 0) + c.profit;
      settings.products.forEach(function (p) { acc.byProd[p.key].sold += c.byProd[p.key].sold; acc.byProd[p.key].revenue += c.byProd[p.key].revenue; });
    });
    return acc;
  }
  function computeRange(daysArr, suppliesArr, settings) {
    var acc = { gross: 0, commission: 0, net: 0, tripExpenses: 0, routeProfit: 0, pieces: 0,
      byProd: {}, byCart: {}, days: 0, trips: 0, supplyTotal: 0, supplyByCat: {} };
    settings.products.forEach(function (p) { acc.byProd[p.key] = { sold: 0, revenue: 0 }; });
    daysArr.forEach(function (d) {
      var c = computeDay(d, settings);
      if (c.trips) acc.days++;
      acc.trips += c.trips;
      acc.gross += c.gross; acc.commission += c.commission; acc.net += c.net;
      acc.tripExpenses += c.expenses; acc.routeProfit += c.profit; acc.pieces += c.pieces;
      Object.keys(c.byCart).forEach(function (k) { acc.byCart[k] = (acc.byCart[k] || 0) + c.byCart[k]; });
      settings.products.forEach(function (p) { acc.byProd[p.key].sold += c.byProd[p.key].sold; acc.byProd[p.key].revenue += c.byProd[p.key].revenue; });
    });
    (suppliesArr || []).forEach(function (m) {
      (m.items || []).forEach(function (it) {
        var t = num(it.qty) * num(it.amount);
        acc.supplyTotal += t;
        acc.supplyByCat[it.category || "Misc"] = (acc.supplyByCat[it.category || "Misc"] || 0) + t;
      });
    });
    acc.netProfit = acc.routeProfit - acc.supplyTotal;
    acc.margin = acc.gross ? acc.netProfit / acc.gross : 0;
    return acc;
  }

  function dailyChartCard(daysArr) {
    var card = h('<section class="card pad"></section>');
    card.appendChild(h("<h2 style='margin-bottom:4px'>Daily gross — " + esc(fmtMonth(S.month)) + "</h2>"));
    var end = +monthEnd(S.month).slice(8);
    var vals = [];
    for (var d = 1; d <= end; d++) {
      var iso = S.month + "-" + String(d).padStart(2, "0");
      var day = S.days[iso];
      vals.push({ d: d, iso: iso, v: day ? computeDay(day, S.settings).gross : 0 });
    }
    var max = Math.max.apply(null, vals.map(function (x) { return x.v; }).concat([1]));
    if (!vals.some(function (x) { return x.v; })) {
      card.appendChild(h('<div class="empty" style="padding:22px"><span class="muted tiny">No sales recorded this month yet.</span></div>'));
      return card;
    }
    var W = 640, H = 190, padL = 46, padB = 22, padT = 10, padR = 8;
    var iw = W - padL - padR, ih = H - padT - padB;
    var bw = iw / vals.length;
    var svg = ['<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Daily gross sales bar chart">'];
    // gridlines + y labels (0, mid, max)
    [0, 0.5, 1].forEach(function (f) {
      var y = padT + ih - f * ih;
      svg.push('<line class="grid" x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) + '"/>');
      svg.push('<text x="' + (padL - 6) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end" font-size="9">' + peso0(f * max) + "</text>");
    });
    svg.push('<line class="axis" x1="' + padL + '" y1="' + (padT + ih) + '" x2="' + (W - padR) + '" y2="' + (padT + ih) + '"/>');
    vals.forEach(function (x) {
      var bh = x.v > 0 ? Math.max(1.5, (x.v / max) * ih) : 0;
      var bx = padL + x.d * bw - bw + bw * 0.16;
      var by = padT + ih - bh;
      if (bh) svg.push('<rect class="bar" x="' + bx.toFixed(1) + '" y="' + by.toFixed(1) + '" width="' + (bw * 0.68).toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="1.5"><title>' + esc(fmtDate(x.iso)) + " — " + peso0(x.v) + "</title></rect>");
      if (x.d % 5 === 0 || x.d === 1) svg.push('<text x="' + (padL + x.d * bw - bw / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="9">' + x.d + "</text>");
    });
    svg.push("</svg>");
    card.appendChild(h(svg.join("")));
    return card;
  }

  function openTripDialog(iso, cartId, existing, isExample) {
    if (!canEdit()) return;
    var day = getDay(iso);
    var editing = !!(existing && existing.id);
    var model = {
      id: (existing && existing.id) || uid(),
      date: iso,
      cart: String((existing && existing.cart) || cartId || (S.settings.carts[0] || {}).id || "1"),
      trip: (existing && existing.trip) || nextTripNo(day, String((existing && existing.cart) || cartId || (S.settings.carts[0] || {}).id || "1")),
      lines: {},
      expenses: (existing && existing.expenses && existing.expenses.length) ? JSON.parse(JSON.stringify(existing.expenses)) : []
    };
    S.settings.products.forEach(function (p) {
      var src = (existing && existing.lines && existing.lines[p.key]) || {};
      model.lines[p.key] = {
        loadedTrays: src.loadedTrays != null ? src.loadedTrays : "",
        loadedLoose: src.loadedLoose != null ? src.loadedLoose : (src.loaded != null ? src.loaded : (isExample ? src.loaded : "")),
        leftoverTrays: src.leftoverTrays != null ? src.leftoverTrays : "",
        leftoverLoose: src.leftoverLoose != null ? src.leftoverLoose : (src.leftover != null ? src.leftover : "")
      };
      if (isExample && existing && existing.lines && existing.lines[p.key]) {
        model.lines[p.key].loadedLoose = existing.lines[p.key].loaded;
        model.lines[p.key].leftoverLoose = existing.lines[p.key].leftover;

    });

    var dlg = h('<dialog></dialog>');
    dlg.innerHTML =
      '<form method="dialog"><div class="dlg-h"><h2>' + (editing ? "Edit route" : "New route") + '</h2>' +

      '<div class="dlg-b"></div>' +
      '<div class="dlg-f"><button class="btn ghost" value="cancel" type="submit">Cancel</button>' +
      '<button class="btn primary" id="tSave" type="button">' + (editing ? "Save changes" : "Save route") + "</button></div></form>";
    var b = dlg.querySelector(".dlg-b");

    // meta
    var meta = h('<div class="g2"></div>');
    var dfld = h('<label class="fld"><span>Date</span><input type="date" value="' + esc(model.date) + '"></label>');
    dfld.querySelector("input").addEventListener("change", function () { model.date = this.value || model.date; });

    var exList = h('<div class="exp"></div>');

      exList.innerHTML = "";
      if (!model.expenses.length) exList.appendChild(h('<div class="tiny muted">No expenses. Add gas, load, snacks, parking…</div>'));

        var r = h('<div class="er"></div>');

    b.appendChild(totBox);
    function updateTotals() {
      // sync computed pieces spans
      S.settings.products.forEach(function (p) {
        var m = model.lines[p.key];
        var loaded = num(m.loadedTrays) * p.perTray + num(m.loadedLoose);

        S.day = targetIso;
        if (monthOf(targetIso) !== S.month) { S.month = monthOf(targetIso); loadWindow().then(render); } else render();
      });

  function pairField(label, m, kTray, kLoose, p) {
    var f = h('<label class="fld"><span>' + esc(label) + " — trays + loose</span></label>");
    var pair = h('<div class="pair"></div>');

    var l = h('<input type="number" inputmode="numeric" min="0" step="1" placeholder="pcs" value="' + (m[kLoose] !== "" && m[kLoose] != null ? esc(m[kLoose]) : "") + '">');

    pair.appendChild(t); pair.appendChild(l);

  function toTrip(model) {
    var lines = {};
    S.settings.products.forEach(function (p) {
      var m = model.lines[p.key];
      var loaded = num(m.loadedTrays) * p.perTray + num(m.loadedLoose);
      var leftover = num(m.leftoverTrays) * p.perTray + num(m.leftoverLoose);
      lines[p.key] = {
        loadedTrays: m.loadedTrays === "" ? null : num(m.loadedTrays),
        loadedLoose: m.loadedLoose === "" ? null : num(m.loadedLoose),
        leftoverTrays: m.leftoverTrays === "" ? null : num(m.leftoverTrays),
        leftoverLoose: m.leftoverLoose === "" ? null : num(m.leftoverLoose),
        loaded: loaded, leftover: leftover, price: num(p.price)
      };
    });
    return {
      id: model.id, cart: String(model.cart), trip: num(model.trip) || 1,
      lines: lines,
      expenses: (model.expenses || []).filter(function (e) { return e.label || num(e.amount); })
        .map(function (e) { return { label: e.label || "Expense", amount: num(e.amount) }; }),
      updatedAt: new Date().toISOString()
    };
  }
  function nextTripNo(day, cartId) {
    var n = 0;
    (day.trips || []).forEach(function (t) { if (String(t.cart) === String(cartId)) n = Math.max(n, num(t.trip) || 0); });
    return n + 1;
  }

  function exportCsv() {
    var end = S.reportMonth, start = addMonths(end, -(S.reportRange - 1));
    store.queryDays(monthStart(start), monthEnd(end)).then(function (daysArr) {
      var rows = [["Date", "Cart", "Route", "Bread", "Loaded", "Leftover", "Sold", "Price", "Revenue", "Route gross", "Seller 15%", "Route expenses", "Route profit"]];
      daysArr.forEach(function (d) {
        (d.trips || []).forEach(function (t) {
          var c = computeTrip(t, S.settings);
          S.settings.products.forEach(function (p) {
            var l = c.lines[p.key];
            rows.push([d.date, cartName(t.cart), t.trip || 1, p.name, l.loaded, l.leftover, l.sold, l.price, round2(l.revenue), round2(c.gross), round2(c.commission), round2(c.expenses), round2(c.profit)]);
          });
        });
      });
      var csv = rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");
      var name = "KRP_routes_" + start + "_to_" + end + ".csv";
      offerDownload(name, csv);
    });
  }
  function round2(n) { return Math.round(num(n) * 100) / 100; }
  function csvCell(v) { v = String(v == null ? "" : v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function offerDownload(filename, text) {
    function fallback() {
      try {
        var blob = new Blob([text], { type: "text/csv" });
        var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        toast("Downloaded " + filename);
      } catch (e) { toast("Could not export"); }
    }
    if (downloadsCap === null && window.claude && window.claude.use) {
      window.claude.use("downloads").then(function (d) { downloadsCap = d || false; doIt(); }).catch(function () { downloadsCap = false; doIt(); });
    } else doIt();
    function doIt() {
      if (downloadsCap && downloadsCap.save) {
        downloadsCap.save({ filename: filename, data: text }).then(function () { toast("Saved " + filename); }).catch(fallback);
      } else fallback();
    }
  }

  /* ---------------- Settings ---------------- */
  function viewSettings() {
    var frag = document.createDocumentFragment();
    frag.appendChild(headBar("Settings", "Products, prices, tray sizes, carts, commission"));

    // commission
    var cCard = h('<section class="card pad" style="margin-bottom:16px"></section>');
    cCard.appendChild(h("<h2 style='margin-bottom:10px'>Seller commission</h2>"));
    var crow = h('<div class="row" style="gap:10px; align-items:end"></div>');
    var ci = h('<label class="fld" style="width:140px"><span>Rate %</span><input type="number" step="0.5" min="0" max="100" value="' + (num(S.settings.commissionRate) * 100) + '"></label>');
    crow.appendChild(ci);
    crow.appendChild(h('<span class="tiny muted">of each route’s gross sales, deducted before route expenses</span>'));
    cCard.appendChild(crow);
    cCard.appendChild(saveBar(function () {
      var v = num(ci.querySelector("input").value) / 100;
      S.settings.commissionRate = Math.max(0, Math.min(1, v));
      saveSettings().then(function () { toast("Saved"); render(); });
    }));
    frag.appendChild(cCard);

    // products
    var pCard = h('<section class="card pad" style="margin-bottom:16px"></section>');
    pCard.appendChild(h('<div class="row" style="justify-content:space-between; margin-bottom:10px"><h2>Bread types</h2></div>'));
    var pBody = h('<div style="display:grid; gap:10px"></div>');
    var working = JSON.parse(JSON.stringify(S.settings.products));
    function drawProducts() {
      pBody.innerHTML = "";
      working.forEach(function (p, idx) {
        var r = h('<div class="row wrap" style="gap:8px; align-items:end; border:1px solid var(--line); border-radius:10px; padding:10px"></div>');
        r.appendChild(h('<i style="width:12px;height:12px;border-radius:3px;background:' + pcolor(p.key) + ';margin-bottom:10px"></i>'));
        var n = h('<label class="fld grow" style="min-width:150px"><span>Name</span><input type="text" value="' + esc(p.name) + '"></label>');
        var pr = h('<label class="fld" style="width:110px"><span>Price /pc</span><input type="number" step="0.25" value="' + esc(p.price) + '"></label>');
        var tr = h('<label class="fld" style="width:110px"><span>Pcs /tray</span><input type="number" step="1" min="1" value="' + esc(p.perTray) + '"></label>');
        n.querySelector("input").addEventListener("input", function () { p.name = this.value; });
        pr.querySelector("input").addEventListener("input", function () { p.price = num(this.value); });
        tr.querySelector("input").addEventListener("input", function () { p.perTray = Math.max(1, num(this.value) || 1); });
        r.appendChild(n); r.appendChild(pr); r.appendChild(tr);
        var rm = h('<button class="btn ghost sm danger" type="button" style="margin-bottom:2px">Remove</button>');
        rm.addEventListener("click", function () { if (working.length <= 1) { toast("Keep at least one bread type"); return; } working.splice(idx, 1); drawProducts(); });
        r.appendChild(rm);
        pBody.appendChild(r);
      });
    }
    drawProducts();
    var addP = mkBtn("+ Add bread type", "sm", function () { working.push({ key: "bread-" + uid().slice(0, 5), name: "New Bread", price: 0, perTray: 20 }); drawProducts(); });
    addP.style.marginTop = "10px";
    pCard.appendChild(pBody); pCard.appendChild(addP);
    pCard.appendChild(saveBar(function () {
      S.settings.products = working.map(function (p) { return { key: p.key, name: p.name || "Bread", price: num(p.price), perTray: Math.max(1, num(p.perTray) || 1) }; });
      saveSettings().then(function () { toast("Saved"); render(); });
    }));
    frag.appendChild(pCard);

    // carts
    var kCard = h('<section class="card pad" style="margin-bottom:16px"></section>');
    kCard.appendChild(h("<h2 style='margin-bottom:10px'>Rolling carts</h2>"));
    var kBody = h('<div style="display:grid; gap:8px"></div>');
    var wCarts = JSON.parse(JSON.stringify(S.settings.carts));
    function drawCarts() {
      kBody.innerHTML = "";
      wCarts.forEach(function (c, idx) {
        var r = h('<div class="row" style="gap:8px"></div>');
        var n = h('<input type="text" value="' + esc(c.name) + '">');
        n.addEventListener("input", function () { c.name = this.value; });
        r.appendChild(n);
        var rm = h('<button class="btn ghost sm danger" type="button">Remove</button>');
        rm.addEventListener("click", function () { if (wCarts.length <= 1) { toast("Keep at least one cart"); return; } wCarts.splice(idx, 1); drawCarts(); });
        r.appendChild(rm);
        kBody.appendChild(r);
      });
    }
    drawCarts();
    var addK = mkBtn("+ Add cart", "sm", function () { wCarts.push({ id: uid().slice(0, 6), name: "Cart " + (wCarts.length + 1) }); drawCarts(); });
    addK.style.marginTop = "10px";
    kCard.appendChild(kBody); kCard.appendChild(addK);
    kCard.appendChild(saveBar(function () {
      S.settings.carts = wCarts.map(function (c, i) { return { id: String(c.id || (i + 1)), name: c.name || ("Cart " + (i + 1)) }; });
      saveSettings().then(function () { toast("Saved"); render(); });
    }));
    frag.appendChild(kCard);

    // data / about
    var aCard = h('<section class="card pad"></section>');
    aCard.appendChild(h("<h3 style='margin-bottom:6px'>About your data</h3>"));
    aCard.appendChild(h('<p class="tiny muted" style="margin:0">' +
      (store.kind === "db"
        ? "Saved to your private Claude workspace — open this page on any device you’re signed in on and the data follows."
        : store.kind === "supabase"
          ? "Saved to Supabase and shared with everyone on the Users list. Routes are one document per day; supplies one per month."
          : "Saved in this browser only (offline mode). Use the published link while signed in to sync across devices.") +
      "</p>"));
    frag.appendChild(aCard);
    return frag;
  }

  /* ---------------- Users ---------------- */
  function loadMembers() {
    if (!multiUser()) return Promise.resolve([]);
    return sb.from("krp_members").select("id,email,role,created_at").order("created_at")
      .then(function (r) { if (r.error) throw r.error; S.members = r.data || []; return S.members; });
  }
  function adminCount() { return S.members.filter(function (m) { return m.role === "admin"; }).length; }
  var ROLE_HELP = {
    admin: "Everything — edit routes, supplies, settings, and this list.",
    member: "Add and edit routes and supplies. Can’t change settings or members.",
    viewer: "Read only — see routes, supplies, and reports; change nothing."
  };

  function viewUsers() {
    var frag = document.createDocumentFragment();
    frag.appendChild(headBar("Users", "Who can open this ledger, and what they can do",
      [ mkBtn("Invite someone", "primary", function () { openInviteDialog(); }) ]));

    var legend = h('<section class="card pad" style="margin-bottom:16px; display:grid; gap:6px"></section>');
    [["admin", "Admin"], ["member", "Member"], ["viewer", "View only"]].forEach(function (r) {
      legend.appendChild(h('<div class="row" style="gap:10px; align-items:baseline"><b style="min-width:82px">' + r[1] + '</b><span class="tiny muted">' + esc(ROLE_HELP[r[0]]) + "</span></div>"));
    });
    frag.appendChild(legend);

    var card = h('<section class="card"></section>');
    var tw = h('<div class="tblwrap"><table class="t"><thead><tr><th>Email</th><th>Role</th><th>Added</th><th></th></tr></thead><tbody></tbody></table></div>');
    var tb = tw.querySelector("tbody");
    if (!usersFresh) {
      usersFresh = true;
      if (!S.members.length) tb.appendChild(h('<tr><td colspan="4" class="muted" style="padding:18px">Loading…</td></tr>'));
      loadMembers().then(render).catch(function (e) { toast((e && e.message) || "Could not load members"); });
    }
    if (S.members.length) {
      S.members.forEach(function (m) {
        var me = authEmail && m.email && authEmail.toLowerCase() === m.email.toLowerCase();
        var tr = h("<tr></tr>");
        tr.appendChild(h("<td>" + esc(m.email) + (me ? ' <span class="pill">you</span>' : "") + "</td>"));

        var roleTd = h("<td></td>");
        var sel = h('<select style="width:130px"></select>');
        ["admin", "member", "viewer"].forEach(function (r) {
          sel.appendChild(h('<option value="' + r + '"' + (m.role === r ? " selected" : "") + ">" + ROLE_LABEL[r] + "</option>"));
        });
        var lastAdmin = m.role === "admin" && adminCount() <= 1;
        if (lastAdmin) sel.disabled = true;
        sel.addEventListener("change", function () {
          var next = sel.value;
          sel.disabled = true;
          sb.from("krp_members").update({ role: next }).eq("id", m.id).then(function (r) {
            if (r.error) { toast(r.error.message); sel.value = m.role; sel.disabled = false; return; }
            m.role = next; toast("Role updated");
            if (me) { S.role = next; setStoreState(); }
            loadMembers().then(render);
          });
        });
        roleTd.appendChild(sel);
        tr.appendChild(roleTd);

        tr.appendChild(h('<td class="muted tiny">' + esc(m.created_at ? fmtDate(m.created_at.slice(0, 10), { month: "short", day: "numeric", year: "numeric" }) : "—") + "</td>"));

        var actTd = h('<td class="n"></td>');
        if (!lastAdmin) {
          var rm = h('<button class="btn ghost sm danger" type="button">Remove</button>');
          rm.addEventListener("click", function () {
            if (!confirm("Remove " + m.email + "? They lose access on their next sign-in.")) return;
            sb.from("krp_members").delete().eq("id", m.id).then(function (r) {
              if (r.error) { toast(r.error.message); return; }
              toast("Removed " + m.email);
              if (me) { location.reload(); return; }
              loadMembers().then(render);
            });
          });
          actTd.appendChild(rm);
        }
        tr.appendChild(actTd);
        tb.appendChild(tr);
      });
    }
    card.appendChild(tw);
    frag.appendChild(card);

    frag.appendChild(h('<p class="tiny muted" style="margin-top:12px">To invite someone: add their email here, then send them the site link — they sign in with that address and land straight in. New sign-ups must be allowed in Supabase → Authentication → Providers → Email.</p>'));
    return frag;
  }

  function openInviteDialog() {
    if (!isAdmin()) return;
    var dlg = h("<dialog></dialog>");
    dlg.innerHTML =
      '<form method="dialog"><div class="dlg-h"><h2>Invite someone</h2><button class="btn ghost sm" value="cancel" type="submit">✕</button></div>' +
      '<div class="dlg-b">' +
      '<label class="fld"><span>Email</span><input type="email" id="ivEmail" autocomplete="off" placeholder="name@example.com"></label>' +
      '<label class="fld"><span>Role</span><select id="ivRole"><option value="member">Member — add &amp; edit routes and supplies</option><option value="viewer">View only — read, change nothing</option><option value="admin">Admin — full access incl. this list</option></select></label>' +
      '<p class="tiny muted" id="ivMsg" style="margin:0"></p>' +
      "</div>" +
      '<div class="dlg-f"><button class="btn ghost" value="cancel" type="submit">Cancel</button><button class="btn primary" id="ivSave" type="button">Add</button></div></form>';
    var msg = dlg.querySelector("#ivMsg");
    dlg.querySelector("#ivSave").addEventListener("click", function () {
      var email = (dlg.querySelector("#ivEmail").value || "").trim().toLowerCase();
      var role = dlg.querySelector("#ivRole").value;
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg.textContent = "That doesn’t look like an email address."; return; }
      var btn = dlg.querySelector("#ivSave"); btn.disabled = true; btn.textContent = "Adding…";
      sb.from("krp_members").insert({ email: email, role: role, invited_by: S.userId }).then(function (r) {
        if (r.error) {
          msg.textContent = /duplicate|unique/i.test(r.error.message) ? email + " is already on the list." : r.error.message;
          btn.disabled = false; btn.textContent = "Add"; return;
        }
        dlg.close();
        toast(email + " added");
        loadMembers().then(render);
        setTimeout(function () {
          alert("Added " + email + " as " + ROLE_LABEL[role] + ".\n\nSend them this link:\n" + location.origin + location.pathname + "\n\nThey sign in with " + email + " and they’re in.");
        }, 100);
      });
    });
    dlg.addEventListener("close", function () { dlg.remove(); });
    document.body.appendChild(dlg);
    dlg.showModal();
  }
  function saveBar(fn) {
    var bar = h('<div class="row" style="justify-content:flex-end; margin-top:12px"></div>');
    bar.appendChild(mkBtn("Save", "primary", fn));
    return bar;
  }

  /* ---------------- shared UI bits ---------------- */
  function mkBtn(label, kind, fn) {
    var b = h('<button type="button" class="btn ' + (kind ? kind.split(" ").join(" ") : "") + '">' + esc(label) + "</button>");
    b.addEventListener("click", fn);
    return b;
  }

  /* ---------------- theme ---------------- */
  function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem("krp:theme"); } catch (e) {}
    if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
    $("#themeBtn").addEventListener("click", function () {
      var cur = document.documentElement.getAttribute("data-theme");
      var next = cur === "dark" ? "light" : cur === "light" ? "dark" : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("krp:theme", next); } catch (e) {}
    });
  }

  /* ============================ boot ============================ */
  function boot() {
    initTheme();
    syncNav();
    initStore().then(function (status) {
      setStoreState();
      if (status === "gate" || status === "handled") return;
      addSignOut();
      return loadSettings().then(loadWindow).then(render);
    }).catch(showBootError);

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible" && store && !S.gate) loadWindow().then(render);
    });
  }
  boot();
})();
</script>
